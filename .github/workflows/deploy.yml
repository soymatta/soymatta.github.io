name: Deploy Astro site to GitHub Pages

on:
  push:
    branches:
      - main # o la rama que uses

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: "pages"
  cancel-in-progress: true

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      # ✅ 1. Checkout del código
      - name: Checkout
        uses: actions/checkout@v4

      # ✅ 2. Configura Node.js (NO instala pnpm todavía)
      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: "pnpm" # cache para pnpm-lock.yaml

      # ✅ 3. Instala pnpm antes de usarlo (ESTE PASO ES CLAVE)
      - name: Setup pnpm
        uses: pnpm/action-setup@v4
        with:
          version: 9 # Usa la misma versión que tengas localmente (pnpm -v)

      # ✅ 4. Instala dependencias
      - name: Install dependencies
        run: pnpm install --frozen-lockfile

      # ✅ 5. Compila el sitio
      - name: Build
        run: pnpm run build

      # ✅ 6. Sube los artefactos de build
      - name: Upload artifact
        uses: actions/upload-pages-artifact@v3
        with:
          path: ./dist

  # ✅ 7. Despliega a GitHub Pages
  deploy:
    needs: build
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
